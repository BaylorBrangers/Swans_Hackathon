[project]
name = "swans-medical-chronology"
version = "0.1.0"
description = "Streamlit medical chronology viewer with injury progression and a demo lost-income estimator"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.32",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
  "huggingface-hub>=0.33",
  "pydantic>=2.6",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]
